<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GymTrack - Your Fitness Journey</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1219">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      height: 100vh;
      padding: 0 1.5rem;
      box-sizing: border-box;
      background-color: #0f1219;
      color: #f8fafc;
      font-family: 'Barlow', sans-serif;
      text-align: center;
    }
    .app-loading .brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .app-loading .brand span {
      color: #f97316;
    }
    .app-loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #1e293b;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading">
      <div class="brand">Gym<span>Track</span></div>
      <div class="spinner"></div>
    </div>
  </app-root>
</body>
</html>
