@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="absolute inset-0 bg-background/80 backdrop-blur-sm" (click)="close()"></div>

    <div class="relative bg-surface border border-border rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between p-5 border-b border-border shrink-0">
        <h2 class="text-lg font-heading font-bold uppercase tracking-wider">Choose Exercise</h2>
        <button type="button" (click)="close()" class="text-text-muted hover:text-text transition-colors cursor-pointer" aria-label="Close">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-5 border-b border-border shrink-0 space-y-3">
        <input type="text" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)"
               placeholder="Search exercises..."
               class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-sm focus:border-primary focus:outline-none transition-colors">
        <div class="grid grid-cols-2 gap-3">
          <select [ngModel]="selectedMuscle()" (ngModelChange)="selectedMuscle.set($event)"
                  class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-sm focus:border-primary focus:outline-none transition-colors">
            <option value="">All Muscles</option>
            @for (m of allMuscleGroups; track m) {
              <option [value]="m">{{ m | titlecase }}</option>
            }
          </select>
          <select [ngModel]="selectedEquipment()" (ngModelChange)="selectedEquipment.set($event)"
                  class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-sm focus:border-primary focus:outline-none transition-colors">
            <option value="">All Equipment</option>
            @for (eq of allEquipment; track eq) {
              <option [value]="eq">{{ eq | titlecase }}</option>
            }
          </select>
        </div>
      </div>

      <div class="overflow-y-auto p-3 space-y-1.5 flex-1">
        @if (filteredExercises().length === 0) {
          <p class="text-text-muted text-sm text-center py-10">No exercises match your filters</p>
        } @else {
          @for (exercise of filteredExercises(); track exercise.id) {
            <button type="button" (click)="select(exercise)"
                    [disabled]="multiple && !isSelected(exercise) && selectedIds().length >= maxSelect"
                    class="w-full text-left flex items-center justify-between p-3 rounded-xl transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
                    [class]="multiple && isSelected(exercise) ? 'bg-primary/10 border border-primary/40' : 'hover:bg-surface-light border border-transparent'">
              <div class="flex items-center gap-3">
                @if (exercise.imageUrl) {
                  <img [src]="exercise.imageUrl" alt="{{ exercise.name }}" class="w-12 h-12 rounded-lg object-contain bg-white shrink-0">
                } @else {
                  <div class="w-12 h-12 rounded-lg bg-surface-light flex items-center justify-center shrink-0 text-text-muted">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                  </div>
                }
                <div>
                  <p class="font-semibold text-sm">{{ exercise.name }}</p>
                  <p class="text-text-muted text-xs mt-0.5 capitalize">{{ exercise.equipment }} &middot; {{ exercise.primaryMuscles.join(', ') }}</p>
                </div>
              </div>
              @if (multiple) {
                @if (isSelected(exercise)) {
                  <svg class="w-5 h-5 text-primary shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                } @else {
                  <span class="w-5 h-5 rounded-full border border-border shrink-0"></span>
                }
              } @else {
                <svg class="w-4 h-4 text-text-muted shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              }
            </button>
          }
        }
      </div>

      @if (multiple) {
        <div class="p-4 border-t border-border shrink-0">
          <button type="button" (click)="confirmMultiple()" class="btn-primary w-full py-2.5">
            Done ({{ selectedIds().length }}/{{ maxSelect }})
          </button>
        </div>
      }
    </div>
  </div>
}
