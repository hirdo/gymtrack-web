<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-8">
    <a routerLink="/workouts" class="text-text-muted hover:text-primary text-sm inline-flex items-center gap-1 transition-colors mb-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Back to Workouts
    </a>
    <h1 class="text-3xl sm:text-4xl font-bold font-heading tracking-wide uppercase">{{ isEditMode() ? 'Edit Workout' : 'Create Workout' }}</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="gym-card space-y-5">
      <div>
        <label for="workout-name" class="block text-sm font-semibold text-text-muted mb-1.5 uppercase tracking-wider">Workout Name</label>
        <input id="workout-name" formControlName="name" type="text" placeholder="e.g., Morning Push Day"
               class="w-full bg-background border border-border rounded-lg px-4 py-3 text-text placeholder-text-muted/40 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
      </div>

      <div>
        <label for="workout-desc" class="block text-sm font-semibold text-text-muted mb-1.5 uppercase tracking-wider">Description <span class="normal-case font-normal">(optional)</span></label>
        <textarea id="workout-desc" formControlName="description" rows="2" placeholder="Brief description of the workout..."
                  class="w-full bg-background border border-border rounded-lg px-4 py-3 text-text placeholder-text-muted/40 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none resize-none transition-colors"></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="workout-category" class="block text-sm font-semibold text-text-muted mb-1.5 uppercase tracking-wider">Category</label>
          <select id="workout-category" formControlName="category"
                  class="w-full bg-background border border-border rounded-lg px-4 py-3 text-text focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors cursor-pointer">
            @for (cat of categories; track cat.value) {
              <option [value]="cat.value">{{ cat.label }}</option>
            }
          </select>
        </div>

        <div>
          <label for="workout-date" class="block text-sm font-semibold text-text-muted mb-1.5 uppercase tracking-wider">Schedule Date <span class="normal-case font-normal">(optional)</span></label>
          <input id="workout-date" formControlName="scheduledDate" type="date"
                 class="w-full bg-background border border-border rounded-lg px-4 py-3 text-text focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors cursor-pointer">
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold font-heading uppercase tracking-wider">Exercises</h2>
        <button type="button" (click)="addExercise()" class="btn-secondary text-sm py-2 px-4">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add Exercise
        </button>
      </div>

      <div formArrayName="exercises" class="space-y-4">
        @for (exercise of exercises.controls; track $index; let i = $index) {
          <div [formGroupName]="i" class="gym-card">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-heading font-semibold text-primary uppercase tracking-wide">Exercise {{ i + 1 }}</h3>
              @if (exercises.length > 1) {
                <button type="button" (click)="removeExercise(i)" class="text-text-muted hover:text-error transition-colors p-1" aria-label="Remove exercise">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              }
            </div>

            <div class="space-y-3">
              <button type="button" (click)="openExercisePicker(i)"
                      class="w-full bg-background border border-border rounded-lg px-4 py-2.5 text-left text-text hover:border-primary/50 focus:border-primary focus:outline-none transition-colors flex items-center justify-between cursor-pointer">
                <span [class]="exercise.get('name')?.value ? '' : 'text-text-muted/60'">
                  {{ exercise.get('name')?.value || 'Choose exercise…' }}
                </span>
                <svg class="w-4 h-4 text-text-muted shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </button>

              @if (exercise.get('trackingType')?.value === 'duration') {
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 uppercase tracking-wider">Sets</label>
                    <input formControlName="sets" type="number" min="1"
                           class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-center font-semibold focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 uppercase tracking-wider">Duration (s)</label>
                    <input formControlName="duration" type="number" min="1"
                           class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-center font-semibold focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
                  </div>
                </div>
              } @else {
                <div class="grid grid-cols-3 gap-3">
                  <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 uppercase tracking-wider">Sets</label>
                    <input formControlName="sets" type="number" min="1"
                           class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-center font-semibold focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 uppercase tracking-wider">Reps</label>
                    <input formControlName="reps" type="number" min="1"
                           class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-center font-semibold focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 uppercase tracking-wider">Weight (kg)</label>
                    <input formControlName="weight" type="number" min="0" step="0.5" placeholder="-"
                           class="w-full bg-background border border-border rounded-lg px-3 py-2.5 text-text text-center font-semibold placeholder-text-muted/40 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
                  </div>
                </div>
              }

              <input formControlName="notes" type="text" placeholder="Notes (optional)"
                     class="w-full bg-background border border-border rounded-lg px-4 py-2 text-text text-sm placeholder-text-muted/40 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors">
            </div>
          </div>
        }
      </div>
    </div>

    <div class="flex gap-4 pt-2">
      <button type="submit" [disabled]="form.invalid" class="btn-primary flex-1 py-3.5 text-base disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
        {{ isEditMode() ? 'Save Changes' : 'Create Workout' }}
      </button>
      <button type="button" (click)="cancel()" class="btn-secondary py-3.5">Cancel</button>
    </div>
  </form>

  <app-exercise-picker-modal
    [open]="pickerOpen()"
    (closed)="closeExercisePicker()"
    (exerciseSelected)="onExercisePicked($event)" />
</div>
